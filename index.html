<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lookfind</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            background-color: #ffffff;
        }
        .logo {
            font-size: 64px;
            font-weight: bold;
            color: #1a0dab;
            margin-bottom: 20px;
            letter-spacing: -2px;
        }
        .search-box {
            width: 100%;
            max-width: 500px;
            padding: 12px 20px;
            font-size: 18px;
            border: 1px solid #dfe1e5;
            border-radius: 24px;
            outline: none;
            box-shadow: 0 1px 6px rgba(32,33,36,.28);
        }
        .search-box:hover, .search-box:focus {
            box-shadow: 0 1px 8px rgba(32,33,36,.38);
            border-color: rgba(223,225,229,0);
        }
        .buttons {
            margin-top: 20px;
        }
        .btn {
            background-color: #f8f9fa;
            border: 1px solid #f8f9fa;
            border-radius: 4px;
            color: #3c4043;
            font-size: 14px;
            margin: 0 4px;
            padding: 10px 16px;
            cursor: pointer;
        }
        .btn:hover {
            box-shadow: 0 1px 1px rgba(0,0,1,0.1);
            background-color: #f8f9fa;
            border: 1px solid #dadce0;
            color: #202124;
        }
    </style>
</head>
<body>

    <div class="logo">Lookfind</div>

    <form action="https://www.google.com/search" method="GET">
        <input type="text" name="q" class="search-box" placeholder="Search the web..." autofocus>
        <div class="buttons">
            <input type="submit" class="btn" value="Lookfind Search">
            <input type="button" class="btn" value="I'm Feeling Lucky" onclick="alert('Feeling lucky today!')">
        </div>
    </form>

</body>
</html>
