<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lookfind</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            transition: all 0.3s ease;
        }
        /* Estado inicial: centrado en la pantalla */
        .search-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            flex-grow: 1;
            width: 100%;
            transition: all 0.3s ease;
        }
        .logo {
            font-size: 64px;
            font-weight: bold;
            color: #1a0dab;
            margin-bottom: 20px;
            letter-spacing: -2px;
            text-decoration: none;
        }
        .search-box {
            width: 100%;
            max-width: 500px;
            padding: 12px 20px;
            font-size: 18px;
            border: 1px solid #dfe1e5;
            border-radius: 24px;
            outline: none;
            box-shadow: 0 1px 6px rgba(32,33,36,.28);
        }
        .search-box:hover, .search-box:focus {
            box-shadow: 0 1px 8px rgba(32,33,36,.38);
            border-color: rgba(223,225,229,0);
        }
        .buttons {
            margin-top: 20px;
        }
        .btn {
            background-color: #f8f9fa;
            border: 1px solid #f8f9fa;
            border-radius: 4px;
            color: #3c4043;
            font-size: 14px;
            margin: 0 4px;
            padding: 10px 16px;
            cursor: pointer;
        }
        .btn:hover {
            box-shadow: 0 1px 1px rgba(0,0,1,0.1);
            background-color: #f8f9fa;
            border: 1px solid #dadce0;
            color: #202124;
        }
        
        /* Contenedor de resultados cuando se busca */
        #results-screen {
            display: none;
            width: 100%;
            flex-direction: column;
            height: 100vh;
        }
        .header-results {
            display: flex;
            align-items: center;
            padding: 15px 20px;
            border-bottom: 1px solid #dfe1e5;
            background: #fff;
        }
        .header-results .logo-small {
            font-size: 24px;
            font-weight: bold;
            color: #1a0dab;
            margin-right: 20px;
            text-decoration: none;
            letter-spacing: -1px;
        }
        .header-results .search-box-small {
            width: 100%;
            max-width: 600px;
            padding: 8px 15px;
            font-size: 16px;
            border: 1px solid #dfe1e5;
            border-radius: 24px;
            outline: none;
        }
        iframe {
            width: 100%;
            flex-grow: 1;
            border: none;
        }
    </style>
</head>
<body>

    <!-- Pantalla de Inicio -->
    <div class="search-container" id="home-screen">
        <a href="#" class="logo" onclick="location.reload(); return false;">Lookfind</a>
        <form onsubmit="performSearch(event)">
            <input type="text" id="searchInput" class="search-box" placeholder="Search the web..." autofocus>
            <div class="buttons">
                <button type="submit" class="btn">Lookfind Search</button>
                <button type="button" class="btn" onclick="alert('Feeling lucky today!')">I'm Feeling Lucky</button>
            </div>
        </form>
    </div>

    <!-- Pantalla de Resultados Integrada -->
    <div id="results-screen">
        <div class="header-results">
            <a href="#" class="logo-small" onclick="location.reload(); return false;">Lookfind</a>
            <form onsubmit="performSearch(event)" style="flex-grow: 1; margin: 0;">
                <input type="text" id="searchInputSmall" class="search-box-small">
            </form>
        </div>
        <!-- Marco integrado para mostrar los resultados -->
        <iframe id="resultsFrame" name="resultsFrame"></iframe>
    </div>

    <script>
        function performSearch(event) {
            event.preventDefault();
            let query = document.getElementById('searchInput').value;
            if (!query) {
                query = document.getElementById('searchInputSmall').value;
            }
            if (!query.trim()) return;

            // Ocultamos la pantalla principal y mostramos la de resultados
            document.getElementById('home-screen').style.display = 'none';
            document.getElementById('results-screen').style.display = 'flex';

            // Sincronizamos los inputs
            document.getElementById('searchInputSmall').value = query;

            // Cargamos la búsqueda en el iframe interno
            // Nota: Usamos una URL compatible con marcos para incrustar resultados
            let targetUrl = 'https://lite.duckduckgo.com/lite/?q=' + encodeURIComponent(query);
            document.getElementById('resultsFrame').src = targetUrl;
        }
    </script>

</body>
</html>
